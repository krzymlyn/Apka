<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaBiezaco</title>
    <!-- Czcionki vintage -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDIF06NUV6cXSATyYoILtdrSCyN2cc-W4",
            authDomain: "aplikacja-27301.firebaseapp.com",
            projectId: "aplikacja-27301",
            storageBucket: "aplikacja-27301.firebasestorage.app",
            messagingSenderId: "193190488932",
            appId: "1:193190488932:web:aac273e693cc3b9a7e6871",
            measurementId: "G-Q36E1Y3H9L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth).catch((error) => console.error("Błąd autoryzacji:", error));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                initApp(db);
            }
        });
    </script>

    <style>
        :root {
            --bg-color: #f7f3ed;
            --paper-bg: #fffdf9;
            --border-color: #d4c5b9;
            --text-color: #2c2421;
            --accent-color: #8c4a32;
            --accent-light: #f4eae4;
        }

        body {
            font-family: 'Courier Prime', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(#e3d7cb 0.8px, transparent 0.8px);
            background-size: 16px 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Układ siatki jak na zdjęciu */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--accent-color);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            text-align: center;
        }

        .card {
            background: var(--paper-bg);
            border: 2px solid var(--border-color);
            padding: 20px;
            box-shadow: 4px 4px 0px rgba(212, 197, 185, 0.6);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card::after {
            content: "";
            position: absolute;
            top: 4px; bottom: 4px; left: 4px; right: 4px;
            border: 1px dashed var(--border-color);
            pointer-events: none;
        }

        input, textarea, select {
            font-family: 'Courier Prime', monospace;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            width: calc(100% - 18px);
            margin-bottom: 10px;
            color: var(--text-color);
            font-size: 0.85rem;
        }

        button {
            font-family: 'Playfair Display', serif;
            background-color: var(--accent-color);
            color: #fff;
            border: 1px solid var(--accent-color);
            padding: 8px 14px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #6f3724;
        }

        /* Podział nastrojów na dwie kolumny */
        .moods-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: center;
        }

        .mood-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mood-column:first-child {
            border-right: 1px dashed var(--border-color);
            padding-right: 10px;
        }

        .mood-emojis {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .mood-emojis span:hover {
            transform: scale(1.2);
        }

        .current-mood-display {
            font-size: 2.2rem;
            margin: 10px 0 5px 0;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--accent-light);
            padding: 6px 10px;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        .list-item.checked span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #900;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 4px;
        }

        .spotify-full {
            grid-column: 1 / -1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="dashboard-grid">
            
            <!-- 1. Nastroje (Rozdzielone na Jusia i Krzyś) -->
            <div class="card">
                <h2>🎭 Nastroje</h2>
                <div class="moods-container">
                    <div class="mood-column">
                        <b style="font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 5px;">Jusia</b>
                        <div id="jusia-mood-display" class="current-mood-display">...</div>
                        <div id="jusia-mood-time" style="font-size: 0.75rem; color: #777; margin-bottom: 10px;"></div>
                        <div class="mood-emojis" onclick="setMood('jusia', event)">
                            <span data-mood="💖">💖</span><span data-mood="✨">✨</span><span data-mood="🥰">🥰</span>
                            <span data-mood="🥺">🥺</span><span data-mood="🍓">🍓</span><span data-mood="☕">☕</span>
                            <span data-mood="😴">😴</span><span data-mood="🔥">🔥</span><span data-mood="🍷">🍷</span>
                        </div>
                    </div>
                    <div class="mood-column">
                        <b style="font-family: 'Playfair Display', serif; font-size: 1.1rem; margin-bottom: 5px;">Krzyś</b>
                        <div id="krzys-mood-display" class="current-mood-display">...</div>
                        <div id="krzys-mood-time" style="font-size: 0.75rem; color: #777; margin-bottom: 10px;"></div>
                        <div class="mood-emojis" onclick="setMood('krzys', event)">
                            <span data-mood="😎">😎</span><span data-mood="💖">💖</span><span data-mood="🥰">🥰</span>
                            <span data-mood="🔥">🔥</span><span data-mood="🎮">🎮</span><span data-mood="☕">☕</span>
                            <span data-mood="😴">😴</span><span data-mood="🥺">🥺</span><span data-mood="🍓">🍓</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Skrzynka Skarg -->
            <div class="card">
                <h2>✍️ Skrzynka Skarg</h2>
                <div>
                    <div id="complaints-list" style="margin-bottom: 15px; max-height: 180px; overflow-y: auto;">
                        <div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;" id="no-complaints">Brak pism.</div>
                    </div>
                </div>
                <div>
                    <input type="text" id="complaint-text" placeholder="Złóż pismo...">
                    <button onclick="addComplaint()" style="float: right;">📤</button>
                </div>
            </div>

            <!-- 3. Propozycje Randek -->
            <div class="card">
                <h2>💌 Propozycje Randek</h2>
                <div>
                    <div id="dates-list" style="margin-bottom: 15px; max-height: 160px; overflow-y: auto;">
                        <div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;" id="no-dates">Brak propozycji...</div>
                    </div>
                </div>
                <div>
                    <input type="datetime-local" id="date-time">
                    <input type="text" id="date-title" placeholder="Gdzie się udamy?">
                    <button onclick="addDateIdea()" style="width: 100%;">WYŚLIJ</button>
                </div>
            </div>

            <!-- 4. Drobne Prośby -->
            <div class="card">
                <h2>❤️ Drobne Prośby</h2>
                <div>
                    <div id="requests-list" style="margin-bottom: 15px; max-height: 180px; overflow-y: auto;">
                        <div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;" id="no-requests">Pusto...</div>
                    </div>
                </div>
                <div>
                    <input type="text" id="request-text" placeholder="O co prosisz?">
                    <button onclick="addRequest()" style="float: right;">💌</button>
                </div>
            </div>

            <!-- 5. Życzenia Jusii -->
            <div class="card">
                <h2>✨ Życzenia Jusii</h2>
                <div>
                    <div id="list-wish-jusia" style="margin-bottom: 15px; max-height: 180px; overflow-y: auto;"></div>
                </div>
                <div>
                    <input type="text" id="wish-jusia" placeholder="Dodaj marzenie lub link...">
                    <button onclick="addWish('jusia')" style="width: 100%;">DODAJ</button>
                </div>
            </div>

            <!-- 6. Życzenia Krzysia -->
            <div class="card">
                <h2>✨ Życzenia Krzysia</h2>
                <div>
                    <div id="list-wish-krzys" style="margin-bottom: 15px; max-height: 180px; overflow-y: auto;"></div>
                </div>
                <div>
                    <input type="text" id="wish-krzys" placeholder="Dodaj marzenie lub link...">
                    <button onclick="addWish('krzys')" style="width: 100%;">DODAJ</button>
                </div>
            </div>

            <!-- 7. Filmy do obejrzenia -->
            <div class="card">
                <h2>🎬 Filmy do obejrzenia</h2>
                <div>
                    <div id="movies-list" style="margin-bottom: 15px; max-height: 180px; overflow-y: auto;"></div>
                </div>
                <div>
                    <input type="text" id="movie-title" placeholder="Tytuł lub link filmu...">
                    <button onclick="addMovie()" style="width: 100%;">DODAJ</button>
                </div>
            </div>

            <!-- 8. Słoik Wspomnień -->
            <div class="card">
                <h2>🍯 Słoik Wspomnień</h2>
                <div>
                    <div id="memories-list" style="margin-bottom: 15px; max-height: 180px; overflow-y: auto;"></div>
                </div>
                <div>
                    <textarea id="memory-text" placeholder="Miłe wspomnienie..." style="height: 40px; resize: none;"></textarea>
                    <button onclick="addMemory()" style="width: 100%;">WRZUĆ DO SŁOIKA</button>
                </div>
            </div>

            <!-- Nuta na dziś (Spotify) -->
            <div class="card spotify-full">
                <h2>🎵 Nuta na dziś</h2>
                <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/4cOdK2wGLETKBW3PvgPWqT?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>

        </div>
    </div>

    <!-- Logika bazy danych -->
    <script type="module">
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        window.initApp = function(db) {
            // Nastroje
            window.setMood = function(who, e) {
                const mood = e.target.getAttribute('data-mood');
                if(!mood) return;
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                setDoc(doc(db, "moods", who), { mood, time: timeStr }, { merge: true });
            }

            onSnapshot(collection(db, "moods"), (snapshot) => {
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const who = docSnap.id;
                    const display = document.getElementById(`${who}-mood-display`);
                    const time = document.getElementById(`${who}-mood-time`);
                    if(display) display.innerText = data.mood || '...';
                    if(time) time.innerText = data.time || '';
                });
            });

            // Skargi
            window.addComplaint = function() {
                const text = document.getElementById('complaint-text').value;
                if(!text) return;
                addDoc(collection(db, "complaints"), { text, timestamp: Date.now() });
                document.getElementById('complaint-text').value = '';
            }

            onSnapshot(collection(db, "complaints"), (snapshot) => {
                let html = "";
                snapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    html += `<div class="list-item"><span>${d.text}</span> <button class="delete-btn" onclick="removeItem('complaints', '${docSnap.id}')">🗑️</button></div>`;
                });
                document.getElementById('complaints-list').innerHTML = html || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Brak pism.</div>';
            });

            // Życzenia
            window.addWish = function(who) {
                const input = document.getElementById(`wish-${who}`);
                if(!input.value) return;
                addDoc(collection(db, "wishes"), { who, text: input.value, checked: false, timestamp: Date.now() });
                input.value = '';
            }

            onSnapshot(collection(db, "wishes"), (snapshot) => {
                let htmlJusia = "";
                let htmlKrzys = "";
                snapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    let itemHtml = `<div class="list-item ${d.checked ? 'checked' : ''}">
                        <label style="cursor:pointer;"><input type="checkbox" ${d.checked ? 'checked' : ''} onclick="toggleCheck('wishes', '${docSnap.id}', ${!d.checked})"> <span>${d.text}</span></label>
                        <button class="delete-btn" onclick="removeItem('wishes', '${docSnap.id}')">🗑️</button>
                    </div>`;
                    if(d.who === 'jusia') htmlJusia += itemHtml;
                    else htmlKrzys += itemHtml;
                });
                document.getElementById('list-wish-jusia').innerHTML = htmlJusia || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Pusto...</div>';
                document.getElementById('list-wish-krzys').innerHTML = htmlKrzys || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Pusto...</div>';
            });

            // Randki
            window.addDateIdea = function() {
                const title = document.getElementById('date-title').value;
                const time = document.getElementById('date-time').value;
                if(!title) return;
                addDoc(collection(db, "dates"), { title, time, status: "Oczekuje na akceptację ⏳", timestamp: Date.now() });
                document.getElementById('date-title').value = '';
                document.getElementById('date-time').value = '';
            }

            window.updateDateStatus = function(id, status) {
                updateDoc(doc(db, "dates", id), { status });
            }

            onSnapshot(collection(db, "dates"), (snapshot) => {
                let html = "";
                snapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    html += `<div class="list-item" style="flex-direction: column; align-items: flex-start; gap: 4px; padding: 8px;">
                        <div><b>${d.title}</b> (${d.time ? d.time.replace('T', ' ') : 'Brak godziny'})</div>
                        <div style="font-size: 0.75rem; font-style: italic;">Status: ${d.status}</div>
                        <div style="display:flex; gap:6px; margin-top:2px; width: 100%; justify-content: space-between;">
                            <div>
                                <button style="padding: 2px 6px; font-size:0.7rem;" onclick="updateDateStatus('${docSnap.id}', 'Zaakceptowane! 💖')">Akceptuj</button>
                                <button style="padding: 2px 6px; font-size:0.7rem; background:#777;" onclick="updateDateStatus('${docSnap.id}', 'Odrzucone ❌')">Odrzuć</button>
                            </div>
                            <button class="delete-btn" onclick="removeItem('dates', '${docSnap.id}')">🗑️</button>
                        </div>
                    </div>`;
                });
                document.getElementById('dates-list').innerHTML = html || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Brak propozycji...</div>';
            });

            // Prośby
            window.addRequest = function() {
                const text = document.getElementById('request-text').value;
                if(!text) return;
                addDoc(collection(db, "requests"), { text, checked: false, timestamp: Date.now() });
                document.getElementById('request-text').value = '';
            }

            onSnapshot(collection(db, "requests"), (snapshot) => {
                let html = "";
                snapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    html += `<div class="list-item ${d.checked ? 'checked' : ''}">
                        <label style="cursor:pointer;"><input type="checkbox" ${d.checked ? 'checked' : ''} onclick="toggleCheck('requests', '${docSnap.id}', ${!d.checked})"> <span>${d.text}</span></label>
                        <button class="delete-btn" onclick="removeItem('requests', '${docSnap.id}')">🗑️</button>
                    </div>`;
                });
                document.getElementById('requests-list').innerHTML = html || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Pusto...</div>';
            });

            // Filmy
            window.addMovie = function() {
                const title = document.getElementById('movie-title').value;
                if(!title) return;
                addDoc(collection(db, "movies"), { title, checked: false, timestamp: Date.now() });
                document.getElementById('movie-title').value = '';
            }

            onSnapshot(collection(db, "movies"), (snapshot) => {
                let html = "";
                snapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    html += `<div class="list-item ${d.checked ? 'checked' : ''}">
                        <label style="cursor:pointer;"><input type="checkbox" ${d.checked ? 'checked' : ''} onclick="toggleCheck('movies', '${docSnap.id}', ${!d.checked})"> <span>${d.title}</span></label>
                        <button class="delete-btn" onclick="removeItem('movies', '${docSnap.id}')">🗑️</button>
                    </div>`;
                });
                document.getElementById('movies-list').innerHTML = html || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Brak filmów...</div>';
            });

            // Słoik wspomnień
            window.addMemory = function() {
                const text = document.getElementById('memory-text').value;
                if(!text) return;
                addDoc(collection(db, "memories"), { text, timestamp: Date.now() });
                document.getElementById('memory-text').value = '';
            }

            onSnapshot(collection(db, "memories"), (snapshot) => {
                let html = "";
                snapshot.forEach((docSnap) => {
                    let d = docSnap.data();
                    html += `<div class="list-item"><span>💌 ${d.text}</span> <button class="delete-btn" onclick="removeItem('memories', '${docSnap.id}')">🗑️</button></div>`;
                });
                document.getElementById('memories-list').innerHTML = html || '<div style="text-align: center; font-style: italic; color: #888; font-size: 0.85rem;">Słoik jest pusty...</div>';
            });

            // Funkcje pomocnicze
            window.removeItem = function(coll, id) {
                deleteDoc(doc(db, coll, id));
            }

            window.toggleCheck = function(coll, id, val) {
                updateDoc(doc(db, coll, id), { checked: val });
            }
        }
    </script>
</body>
</html>
